<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<script>
// /?a=<albumo-slug>/edit -> tiesiai i admin albumo redagavima (admin pats
// paprasys prisijungti ir po prisijungimo grazins atgal).
(function(){var a=new URLSearchParams(location.search).get("a")||"";var m=a.match(/^(.+?)\/+edit\/?$/);if(m)location.replace("/admin/?page=album_edit&slug="+encodeURIComponent(m[1]));})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>foto.klajunas.lt — albumai</title>
<meta name="description" content="OK Klajūnas nuotraukų archyvas — orientavimosi sporto, bėgimo ir žygių renginių albumai.">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b0e12">
<style>
  :root {
    /* Width of the content column shared by the header, the album grid and the
       lightbox bar, so their controls line up on wide screens. */
    --shell: 1200px;
    --bg: #fdfdfc;
    --ink: #1a1a1a;
    --ink-soft: #6b6b6b;
    --ink-faint: #71716b;
    --line: #e8e8e2;
    --line-strong: #cfcfc8;
    --card-bg: #f7f7f4;
    --panel: #ffffff;
    --topbar: rgba(253, 253, 252, .9);
    --overlay: rgba(252, 252, 250, .96);
    --chip-active: #f1f1ec;
    --counter-bg: rgba(255, 255, 255, .88);
    --amber: #ffb74a;
    --amber-soft: rgba(255, 183, 74, .16);
    --amber-line: rgba(214, 143, 32, .45);
    --amber-ink: #8a5a10;
    --radius: 14px;
  }
  body.dark {
    --bg: #0b0e12;
    --ink: #e8eef6;
    --ink-soft: #a7b3c2;
    --ink-faint: #77828f;
    --line: rgba(255, 255, 255, .09);
    --line-strong: rgba(255, 255, 255, .22);
    --card-bg: #10151b;
    --panel: #151a20;
    --topbar: rgba(11, 14, 18, .88);
    --overlay: rgba(9, 12, 15, .96);
    --chip-active: #2a2013;
    --counter-bg: rgba(16, 21, 27, .85);
    --amber-soft: rgba(255, 183, 74, .14);
    --amber-line: rgba(255, 183, 74, .4);
    --amber-ink: #ffc46b;
  }
  /* Du svytejimai: vienas virsuje (buvo ir anksciau), antras - puslapio
     apacioje, kad ilgame albume pabaiga neatrodytu nukirsta. Abu priristi prie
     body deles, todel slenka kartu su turiniu. */
  body.dark {
    background:
      radial-gradient(1200px 800px at 50% -200px, rgba(255,183,74,.10), transparent 60%),
      radial-gradient(1000px 600px at 50% calc(100% + 150px), rgba(255,183,74,.09), transparent 60%),
      var(--bg);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ---------- Topbar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--topbar);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  /* row-gap atskirai nuo column-gap: persilauzus i antra eilute tarpas lieka
     toks pat, o ne dvigubas. align-items:center laiko valdiklius vienoje
     linijoje su logotipu tiek vienoje, tiek dviejose eilutese. */
  .topbar-inner {
    max-width: 1200px; margin: 0 auto; padding: 10px 20px;
    display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: center; gap: 9px; cursor: pointer;
    background: none; border: 0; padding: 0;
  }
  .brand-logo { display: block; height: 46px; width: auto; }
  .brand .name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .brand .name span { color: var(--ink-soft); font-weight: 400; }
  .controls { display: flex; gap: 10px; align-items: center; flex: 1; flex-wrap: wrap; justify-content: flex-end; row-gap: 10px; }
  .search {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--panel);
    border-radius: 99px; padding: 8px 14px; flex: 1; min-width: 190px; max-width: 340px;
    transition: border-color .18s, box-shadow .18s;
  }
  .search { position: relative; }
  .q-drop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: 260px; z-index: 60;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,.14); max-height: 60vh; overflow: auto; }
  .q-drop button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px;
    background: transparent; color: var(--ink); font: inherit; font-size: 13.5px; cursor: pointer; }
  .q-drop button small { color: var(--ink-faint); margin-left: 8px; font-size: 12px; }
  .q-drop button:hover, .q-drop button.act { background: var(--amber-soft); }
  .q-drop-empty { padding: 8px 10px; color: var(--ink-faint); font-size: 13px; }
  .search:focus-within { border-color: var(--amber-line); box-shadow: 0 0 0 3px var(--amber-soft); }
  .search svg { width: 15px; height: 15px; stroke: var(--ink-faint); flex-shrink: 0; }
  /* Sava "x", o ne narsykles: ta rodoma ne visose narsyklese, nepaklusta temai
     ir Safari jos apskritai nera. */
  .search input::-webkit-search-cancel-button { display: none; }
  .q-clear {
    display: grid; place-items: center; flex-shrink: 0;
    width: 20px; height: 20px; padding: 0; margin: 0 -4px 0 0;
    border: 0; border-radius: 99px; background: transparent;
    color: var(--ink-faint); cursor: pointer; transition: color .15s, background .15s;
  }
  .q-clear:hover { color: var(--ink); background: var(--amber-soft); }
  .q-clear svg { width: 13px; height: 13px; stroke: currentColor; }
  .search input { border: 0; outline: none; background: transparent; width: 100%; font: inherit; font-size: 13.5px; color: var(--ink); }
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: "⌄"; position: absolute; right: 13px; top: 50%; transform: translateY(-60%);
    color: var(--ink-faint); pointer-events: none; font-size: 13px;
  }
  select {
    appearance: none; -webkit-appearance: none;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 99px; padding: 8px 32px 8px 14px; font: inherit; font-size: 13px;
    cursor: pointer; outline: none; transition: border-color .18s;
  }
  select:hover, select:focus { border-color: var(--line-strong); }
  .pill {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    border-radius: 99px; padding: 8px 15px; font-size: 13px; cursor: pointer;
    transition: all .18s;
  }
  .pill-upload {
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    border-color: var(--amber-line); color: var(--amber-ink); background: var(--amber-soft);
  }
  .pill-upload svg { width: 15px; height: 15px; flex-shrink: 0; }
  .pill-upload:hover { border-color: var(--amber-ink); color: var(--amber-ink); }
  /* Icon only below 860px — with the label the theme toggle wraps at 761-792px. */
  @media (max-width: 860px) { .pill-upload span { display: none; } .pill-upload { padding-left: 11px; padding-right: 11px; } }
  .pill:hover { border-color: var(--line-strong); color: var(--ink); }
  .pill:active { transform: translateY(1px); }
  .pill.primary { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber-ink); }

  /* ---------- Layout ---------- */
  /* Virsutinis tarpas buvo 22 px, o po juo dar ejo albumo antrastes savi
     tarpai - tarp juostos ir pavadinimo likdavo apie 40 px tuscios vietos. */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 12px 20px 60px; }

  .admin-panel {
    border: 1px solid var(--amber-line); background: var(--amber-soft);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px;
  }
  .admin-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; color: var(--amber-ink); }
  .admin-tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .admin-tools .pill[disabled] { opacity: .55; cursor: not-allowed; }

  .back-pill {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 99px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0; transition: all .15s; display: none;
  }
  .back-pill.show { display: block; }
  .back-pill:hover { border-color: var(--amber-line); background: var(--amber-soft); color: var(--amber-ink); }

  .status { color: var(--ink-faint); font-size: 13px; margin: 2px 0 18px; font-variant-numeric: tabular-nums; }

  .album-head {
    margin: 0; padding: 8px 0 12px; border-bottom: 1px solid var(--line);
    /* Dideliuose albumuose (285 nuotraukos) nusileidus zemyn juosta su "Atgal"
       nubegdavo kartu su turiniu, ir grizti buvo galima tik parslinkus i pati
       virsu. Lipdom po virsutine juosta - jos aukstis kinta (siaurame ekrane
       paieska persilauzia i antra eilute), todel matuojamas ir paduodamas per
       --topbar-h. */
    position: sticky; top: var(--topbar-h, 64px); z-index: 15;
    background: var(--bg);
  }
  /* Trys stulpeliai, kraštiniai vienodo ploto - tik taip pavadinimas atsiduria
     tikrame viduryje. Su flex jis buvo prilipdytas prie "Atgal" mygtuko, o
     desineje esantys veiksmai kur kas platesni, tad vidurio nesigaudavo.
     Pavadinimui pailgejus kraštiniai stulpeliai susitraukia iki savo turinio. */
  .album-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
  .album-bar .back-pill { justify-self: start; }
  /* Be nowrap ir ellipsis: ilgas pavadinimas persikelia i kita eilute, o ne
     nukerpamas. Ilgiausi archyve - 80 simboliu. */
  .album-bar h2 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; min-width: 0; text-align: center; }
  .album-actions { display: flex; gap: 8px; align-items: center; justify-self: end; flex-shrink: 0; }
  @media (max-width: 620px) {
    /* Siaurame ekrane trys stulpeliai netelpa: pavadinimas lieka salia "Atgal",
       veiksmai persikelia i savo eilute. */
    .album-bar { grid-template-columns: auto 1fr; row-gap: 10px; }
    .album-bar h2 { text-align: left; }
    .album-actions { grid-column: 1 / -1; justify-self: start; flex-wrap: wrap; }
  }
  .album-sub { color: var(--ink-soft); font-size: 13.5px; margin: 10px 0 18px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .album-sub .d { opacity: .4; }
  .tag {
    font-size: 11.5px; color: var(--amber-ink); background: var(--amber-soft);
    padding: 2.5px 9px; border-radius: 99px; font-weight: 550;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .tag-mini {
    font-size: 10.5px; color: var(--amber-ink); background: var(--amber-soft);
    padding: 2px 8px; border-radius: 99px; font-weight: 550; cursor: pointer;
    transition: filter .15s, box-shadow .15s; line-height: 1.5;
  }
  .tag-mini:hover { filter: brightness(1.25); }
  .tag-mini.on { box-shadow: inset 0 0 0 1px var(--amber-ink); }
  .tag-mini.more { cursor: default; opacity: .75; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
    padding: 7px 15px; border-radius: 99px; font-size: 13px; cursor: pointer; transition: all .18s;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--ink); }
  .chip.active { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber-ink); font-weight: 550; }
  .view-toggle { display: flex; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .view-toggle button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-soft); font-size: 12.5px; transition: all .15s; }
  .view-toggle button.active { background: var(--chip-active); color: var(--ink); }

  /* ---------- Grids ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
  .grid.photos { grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 16px; }
  .grid.photos.large { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  @media (min-width: 1440px) {
    :root { --shell: 1400px; }
    .wrap, .topbar-inner { max-width: 1400px; }
    #albumGrid { grid-template-columns: repeat(5, 1fr); }
  }
  @media (min-width: 1200px) and (max-width: 1439.98px) {
    #albumGrid { grid-template-columns: repeat(4, 1fr); }
  }

  .card {
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    background: var(--panel); cursor: pointer; text-align: left;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    animation: rise .35s ease both;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: 0 10px 26px rgba(30,25,10,.07); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .thumb { aspect-ratio: 4 / 3; background: var(--card-bg); position: relative; overflow: hidden; }
  .thumb svg { display: block; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2,.7,.3,1); }
  .card:hover .thumb svg { transform: scale(1.045); }
  .badge {
    position: absolute; top: 9px; right: 10px; color: #fff; font-size: 11.5px;
    background: rgba(20,16,8,.42); backdrop-filter: blur(3px);
    padding: 3px 9px; border-radius: 99px; font-variant-numeric: tabular-nums;
  }
  .badge-date {
    top: auto; left: auto; bottom: 9px; right: 10px;
    text-transform: capitalize;
  }
  /* Privatus albumas: spyna vietoj virselio (virselis irgi butu jo nuotrauka). */
  .badge-private { right: auto; left: 10px; }
  .lock-cover {
    display: grid; place-items: center; height: 100%; text-align: center;
    color: var(--ink-soft); font-size: 13px; line-height: 1.5;
    background: repeating-linear-gradient(135deg, transparent 0 12px, var(--line) 12px 13px);
  }
  .lock-cover b { font-size: 26px; font-weight: 400; }
  .private-panel {
    max-width: 460px; margin: 10px auto 0; padding: 22px 20px; text-align: center;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
  }
  .private-panel h3 { margin: 0 0 6px; color: var(--ink); font-size: 17px; }
  .private-panel .pill { display: inline-block; margin-top: 14px; text-decoration: none; color: var(--ink); }
  .private-bar { font-size: 13px; color: var(--ink-soft); margin: -4px 0 14px; }
  .private-bar a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .card-meta { padding: 11px 13px 12px; }
  .card-meta .title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; }
  .card-meta .sub {
    display: flex; flex-wrap: wrap; gap: 2px 12px;
    color: var(--ink-soft); font-size: 12.5px; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .card-meta .sub .place { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }

  .pcard { position: relative; border-radius: var(--radius); overflow: hidden; cursor: zoom-in; background: var(--card-bg); animation: rise .35s ease both; }
  .pcard svg { display: block; width: 100%; height: auto; transition: transform .5s cubic-bezier(.2,.7,.3,1); }
  .pcard:hover svg { transform: scale(1.04); }
  .pcard .pmeta {
    position: absolute; inset: auto 0 0 0; padding: 26px 12px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.4));
    color: #fff; font-size: 12.5px; display: flex; justify-content: space-between;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .pcard:hover .pmeta { opacity: 1; }
  /* Position badge ("3 / 28"). Always on; it steps aside on hover so it never
     collides with the filename/size bar that slides in. */
  .pindex {
    position: absolute; left: 8px; bottom: 8px; display: block;
    padding: 3px 8px; border-radius: 99px;
    background: rgba(0,0,0,.55); color: #fff;
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    pointer-events: none; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: opacity .25s;
  }
  .pcard:hover .pindex { opacity: 0; }
  .fav-btn {
    position: absolute; top: 9px; right: 9px; width: 32px; height: 32px;
    border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.88); backdrop-filter: blur(4px);
    /* The heart used to inherit the page colour, which is near-white in dark
       mode — the button then read as a blank white dot. Pin it dark. */
    color: #2b2b2b;
    display: grid; place-items: center; opacity: 0; transition: opacity .2s, transform .15s;
    font-size: 14px; line-height: 1;
  }
  .fav-btn.on { color: #d64545; }
  .pcard:hover .fav-btn, .fav-btn.on { opacity: 1; }
  .fav-btn:active { transform: scale(.85); }

  .empty { color: var(--ink-soft); text-align: center; padding: 60px 0 30px; font-size: 14.5px; }

  footer {
    border-top: 1px solid var(--line); margin-top: 40px; padding: 22px 20px 34px;
    text-align: center; color: var(--ink-faint); font-size: 13px;
    display: flex; align-items: center; justify-content: center; gap: 8px 16px; flex-wrap: wrap;
  }
  /* Admin iejimas cia, o ne antrastėje: juo naudojasi vienas zmogus, o
     virsutine juosta skirta tam, ka daro kiekvienas lankytojas. */
  .admin-link {
    color: var(--ink-faint); text-decoration: none;
    border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px;
    transition: color .18s, border-color .18s;
  }
  .admin-link:hover, .admin-link:focus-visible { color: var(--ink-soft); border-color: var(--line-strong); }

  /* ---------- Viewer ---------- */
  .lb {
    position: fixed; inset: 0; background: var(--overlay);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: none; z-index: 50; flex-direction: column;
  }
  .lb.open { display: flex; }
  .lb { overflow-y: auto; }
  .lb-top {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    /* Bar stays full-bleed (background + border), but its controls sit inside the
       same column as the album grid — otherwise they fly to the screen edges. */
    padding: 14px max(24px, calc((100% - var(--shell)) / 2 + 20px));
    position: sticky; top: 0; z-index: 5;
    background: var(--topbar); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .lb-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .lb-left .titles { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-left .back-pill { flex-shrink: 0; }
  .lb-title { font-size: 14.5px; font-weight: 600; }
  .lb-album {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    /* Siauresniame lange sriftas mazesnis - kitaip net dviem eilutem vietos
       nepakanka ir ilgas pavadinimas vis tiek butu nukirptas. */
    font-size: clamp(15px, 1.35vw, 19px); font-weight: 750; color: var(--ink); letter-spacing: -.01em;
    /* Dvi eilutes, ne viena. Ilgi pavadinimai - "Begimas "Pabaiskas - Ukmerge",
       skirtas Lietuvos Valstybes atkurimo dienai" - i viena eilute netilpdavo ir
       buvo nukerpami maždaug per puse. Juostos aukscio tai nekeicia: viduje
       mygtukai 40 px + 2x14 px tarpai = 68 px, o dvi 19 px eilutes uzima ~46 px.
       Nukirpimas lieka tik tam atvejui, kai ir dvieju eiluciu nepakanka. */
    line-height: 1.2;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
    /* Sita riba naudojama tik tol, kol nesuveike sizeLbAlbum() - ji plotį
       apskaiciuoja is tikru kaimynu krastu. Fiksuoti 620 px ilgus pavadinimus
       nukirsdavo, o siaurame lange dezute uzlipdavo ant desines mygtuku. */
    max-width: min(46%, 620px); pointer-events: none; text-align: center;
    /* Shifted with margin-left, applied instantly: the info panel itself pops in
       via display:none/block, so animating the title would only desync them. */
    margin-left: 0;
  }
  /* The info panel eats 300px on the right, so the photo's centre moves 150px
     left — follow it, or the title sits off-centre above the image. */
  @media (min-width: 761px) {
    .lb.info-open .lb-album { margin-left: -150px; }
  }
  @media (max-width: 900px) { .lb-album { display: none; } }
  .lb-actions { display: flex; gap: 8px; }
  .lb .icon {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); cursor: pointer; font-size: 15px; display: grid; place-items: center;
    transition: all .15s;
  }
  .lb .icon:hover { border-color: var(--amber-line); background: var(--amber-soft); }
  .lb .icon.on { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber-ink); }
  .lb .icon svg { width: 17px; height: 17px; stroke: currentColor; }
  .lb-body { flex: 1; display: flex; min-height: 0; }
  .lb-stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 0 20px 24px; min-width: 0; position: relative; }

  .lb-nav svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .lb-nav:hover { border-color: var(--amber-line); background: var(--amber-soft); }
  .lb-counter {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: var(--counter-bg); backdrop-filter: blur(4px);

    color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums;
  }

  .info-panel {
    width: 300px; flex-shrink: 0; border-left: 1px solid var(--line);

  }
  .info-panel.show { display: block; }
  .info-panel h3 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); margin-bottom: 14px; }
  .info-panel table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .info-panel td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .info-panel td.k { color: var(--ink-soft); width: 92px; padding-right: 10px; }
  .info-panel td.v { color: var(--ink); word-break: break-word; }

  @media (max-width: 760px) {
    /* Overlay the stage. Both arrows keep the same amber "active" look in every
       state — a hardcoded white pill was unreadable in dark mode, and on touch a
       lingering :hover made only the last-tapped arrow look different. */
    .lb-nav,
    .lb-nav:hover,
    .lb-nav:focus,
    .lb-nav:active {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
      background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber-ink);

    .info-panel table { font-size: 12.5px; }
  }

  /* ================= Touch devices ================= */
  @media (hover: none) and (pointer: coarse) {
    #btnAdmin, #adminPanel { display: none !important; }
    /* No hover to reveal it, and the filename/size is noise on a phone:
       show only the position badge instead. */
    .pcard .pmeta { display: none; }
    .pindex { display: block; }
    .view-toggle { display: none; }
    /* Favourites are a desktop-only affordance (they live in this browser's
       storage only), so drop the filter chip and every heart with it. */
    #favFilter, .fav-btn, #lbFav { display: none !important; }
  }

  /* ================= Tablet (<=1024px) ================= */
  @media (max-width: 1024px) {
    .topbar-inner, .wrap { padding-left: 16px; padding-right: 16px; }
    #albumGrid { grid-template-columns: repeat(3, 1fr); }
    .grid.photos { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .grid.photos.large { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    /* Touch targets */
    .pill, select { padding-top: 10px; padding-bottom: 10px; }
    .pcard { cursor: pointer; }
  }

  /* ================= Narrow tablet (<=760px) ================= */
  /* Search + two filters + upload + theme don't fit next to the brand here, so
     the theme toggle used to wrap onto a row of its own. Same fix as on phones:
     the two pills go top-right on the brand row, controls get the full row. */
  @media (max-width: 760px) {
    .topbar-inner { position: relative; }
    .controls { flex: 1 1 100%; justify-content: flex-start; }
    .search { max-width: none; }
    #themeToggle { position: absolute; top: 13px; right: 16px; }
    .pill-upload { position: absolute; top: 13px; right: 98px; padding: 0 12px; height: 40.8px; box-sizing: border-box; }
  }

  /* Small phones: logo and buttons only — the name would crowd the pills.
     The brand button keeps its aria-label, so nothing is lost for readers. */
  @media (max-width: 359px) {
    .brand .name { display: none; }
  }

  /* ================= Phone (<=640px) ================= */
  @media (max-width: 640px) {
    .topbar-inner { padding: 10px 14px; gap: 10px; row-gap: 10px; position: relative; }
    .brand-logo { height: 36px; }
    .brand .name { font-size: 15px; }
    .controls { flex: 1 1 100%; width: 100%; justify-content: flex-start; gap: 8px; }
    .search { flex: 1 1 100%; max-width: none; min-width: 0; order: -1; }
    .select-wrap { flex: 1 1 calc(50% - 4px); min-width: 0; }
    .select-wrap select { width: 100%; }
    .pill { flex: 0 0 auto; }

    /* Theme toggle sits top-right on the brand row; admin is desktop-only. */
    #themeToggle { position: absolute; top: 12px; right: 14px; }
    /* Upload sits just left of it — otherwise it wraps onto a row of its own. */
    .pill-upload { top: 12px; right: 96px; }
    #btnAdmin, #adminPanel { display: none !important; }

    /* Filename + file size are noise here — keep only "N / total". */
    .pcard .pmeta { display: none; }
    .pindex { display: block; }

    /* Grid/Large switch is pointless at this width — the grid is always 2-up. */
    .view-toggle { display: none; }
    /* Favourites removed on phones (see touch block above). */
    #favFilter, .fav-btn, #lbFav { display: none !important; }

    .wrap { padding: 16px 14px 48px; }
    .status { font-size: 12.5px; margin-bottom: 14px; }

    #albumGrid, .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .grid.photos, .grid.photos.large { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card-meta { padding: 9px 10px 11px; }
    .card-meta .title { font-size: 12.8px; line-height: 1.3; }
    .card-meta .sub { font-size: 11.3px; }
    .badge, .badge-date { font-size: 10.5px; }
    .card-tags { gap: 4px; margin-top: 5px; }
    .tag-mini { font-size: 10px; padding: 2px 7px; }
    .card:hover { transform: none; box-shadow: none; }
    .card:hover .thumb svg { transform: none; }

    .album-bar h2 { font-size: 17px; }
    .album-sub { font-size: 12.5px; }

    /* Lightbox: full-screen, touch-first */
    .lb-top { padding: 10px 12px; gap: 8px; }
    .lb-left { gap: 8px; }
    .lb-title { font-size: 12.5px; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }

    .lb-nav { width: 42px; height: 42px; }
    .lb-stage { padding: 0 8px 10px; gap: 0; }
    .info-panel { max-height: 55vh; padding: 16px 14px; }
    .info-panel td.k { width: 88px; }
  }

  /* Very narrow phones only (iPhone SE at 375px still gets two columns) */
  @media (max-width: 330px) {
    #albumGrid, .grid, .grid.photos, .grid.photos.large { grid-template-columns: 1fr; }
    .lb-title { max-width: 34vw; }

  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.2,.7,.3,1); }

  /* Didinimas. Vaizdas keiciamas tik transform'u, todel islieka tas pats <img>

     laiko padidinta vaizda remeliuose, kad jis neuzlystu ant mygtuku. */
  .lb-img { overflow: hidden; }

  .lb-notice {

  .toast {

<script>
(function () {
  const API = "b2-gallery.php";
  const $ = id => document.getElementById(id);

  // Diagnostika TIK kūrimo režimu: ?debug=1 arba localStorage klajunas_debug=1.
  // Be šio jungiklio nespausdinama nė viena eilutė ir nekabinamas stebėtojas,
  // tad viešam lankytojui puslapis elgiasi lygiai taip pat kaip anksčiau.
  const DEBUG = (function () {
    try {
      if (new URLSearchParams(location.search).get("debug") === "1") return true;
      return localStorage.getItem("klajunas_debug") === "1";
    } catch (e) { return false; }
  })();
  const dlog = (...a) => { if (DEBUG) console.log("[foto]", ...a); };

  // Viršelių užklausų skaičius imamas iš tinklo įrašų, o ne iš DOM: paveikslėliai
  // yra loading="lazy", tad <img> elementų puslapyje visada daugiau, nei realiai
  // nuėjo užklausų.
  let coverRequests = 0;
  if (DEBUG && window.PerformanceObserver) {
    try {
      new PerformanceObserver(list => {
        for (const e of list.getEntries()) if (e.name.indexOf("img.php") !== -1) coverRequests++;
      }).observe({ type: "resource", buffered: true });
    } catch (e) {}
  }

  const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const fmtN = n => Number(n || 0).toLocaleString("lt-LT");
  const fmtBytes = n => { n = Number(n); if (!Number.isFinite(n) || n <= 0) return ""; const u = ["B", "KB", "MB", "GB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(1) : Math.round(n)) + " " + u[i]; };
  let toastTimer = null;
  function toast(msg) {
    let t = $("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
  }
  function previewIssue(p) {
    if (p.previewMissing) return "HEIC originalas įkeltas, bet JPG peržiūra nesukurta.";
    if (!p.thumbUrl || !p.viewUrl) return "Šiai nuotraukai peržiūra nesukurta.";
    return null;
  }
  function markLoaded(im) {
    if (!im) return;
    const done = () => im.classList.add("loaded");
    if (im.complete && im.naturalWidth) done();
    else { im.onload = done; im.onerror = done; }
  }
  const MONTHS_LT = ["Sausis", "Vasaris", "Kovas", "Balandis", "Gegužė", "Birželis", "Liepa", "Rugpjūtis", "Rugsėjis", "Spalis", "Lapkritis", "Gruodis"];
  const monthYear = d => d && d.length >= 7 ? `${MONTHS_LT[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}` : "";
  const dateLabel = al => al.eventDateLabel || al.eventDate || "";

  let ALBUMS = [];
  let currentAlbum = null;
  let photos = [];
  let visible = [];
  let renderedCount = 0;
  let nextCursor = "";
  let loadingPhotos = false;
  let favsOnly = false;
  let lbIndex = 0;
  const CHUNK = 24;
  const metaCache = new Map();

  let favs = new Set();
  try { favs = new Set(JSON.parse(localStorage.getItem("klajunas_favs") || "[]")); } catch (e) {}
  const saveFavs = () => { try { localStorage.setItem("klajunas_favs", JSON.stringify([...favs])); } catch (e) {} };

  async function api(params) {
    const r = await fetch(API + "?" + new URLSearchParams(params), { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "API klaida");
    return d;
  }

  // ================= Archive =================
  // Žymių sąrašas surenkamas iš jau atėjusių albumų, todėl po kiekvienos dalies
  // perkuriamas nuo nulio - papildant jis dubliuotų pasirinkimus. Pirmas
  // <option> ("All tags") lieka vietoje, o naudotojo pasirinkimas grąžinamas.
  function refreshTagOptions() {
    const sel = $("tagFilter");
    const cur = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    const tags = [...new Set(ALBUMS.flatMap(a => a.tags || []))].sort((a, b) => a.localeCompare(b, "lt"));
    tags.forEach(t => { const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o); });
    if (cur && tags.indexOf(cur) !== -1) sel.value = cur;
  }

  async function loadAlbums() {
    $("status").textContent = "Kraunami albumai…";
    try {
      // Serveris atiduoda albumus dalimis (nextCursor). Anksčiau uzklausa buvo
      // viena, todel archyve visada matesi tik pirmieji ~60 albumu.
      //
      // Dalis parodoma IS KARTO, kai tik ateina - laukti visu reikstu tuscia
      // ekrana, kol suskaiciuojami visi albumai. Likusios prisideda fone.
      ALBUMS = [];
      let cursor = "";
      let guard = 0;
      let first = true;
      let pageNo = 0;
      const tStart = performance.now();
      dlog("albumų sąrašas: pradedam");
      do {
        // limit=200 (API leidžia daugiausia tiek). Vienos užklausos kaina beveik
        // nepriklauso nuo albumų kiekio joje - matuota 24→485 ms, 60→501 ms,
        // 200→656 ms - tad svarbu ne dalies dydis, o kiek kartų tą kainą sumoki.
        // 296 albumai: su 60 tai 5 užklausos ir ~2,0 s, su 200 - 2 užklausos ir
        // ~0,8 s. Pirmas parodymas nesikeičia (425 ms prieš 439 ms).
        const params = { withCovers: 1, limit: 200 };
        if (cursor) params.cursor = cursor;
        const t0 = performance.now();
        const page = await api(params);
        const dt = performance.now() - t0;
        pageNo++;
        dlog(`albumų JSON #${pageNo}${cursor ? " (cursor=" + cursor + ")" : ""}: ` +
             `${Math.round(dt)} ms, gauta ${(page.items || []).length}`);
        ALBUMS.push(...(page.items || []).filter(i => i.type === "folder"));
        refreshTagOptions();
        renderArchive();
        if (first) {
          first = false;
          await openFromUrl();          // gilioji nuoroda atsidaro nelaukiant likusiu
        }
        const next = page.nextCursor || "";
        if (next === cursor) break;      // apsauga nuo begalinio ciklo
        cursor = next;
        $("status").textContent = cursor ? `Kraunami albumai… ${ALBUMS.length}` : "";
      } while (cursor && ++guard < 40);
      $("status").textContent = "";
      dlog(`albumų sąrašas baigtas: ${pageNo} užklausos, ${ALBUMS.length} albumai, ` +
           `${Math.round(performance.now() - tStart)} ms`);
      // Viršelius traukia naršyklė, kai kortelė priartėja prie ekrano, tad
      // skaičių rodom kitame kadre - iš karto po render'io jis dar būtų 0.
      if (DEBUG) setTimeout(() => dlog(`viršelių (img.php) užklausų iki šiol: ${coverRequests}`), 1500);
      // Jei nuoroda rode i albuma, kuris atejo velesneje dalyje - atidarom dabar.
      if (!currentAlbum) await openFromUrl();
    } catch (e) {
      $("status").textContent = "Nepavyko užkrauti albumų: " + e.message;
    }
  }

  // Mirrors the CSS breakpoints that strip favourites/toggles on phones.
  const compactUI = () =>
    window.matchMedia("(hover: none) and (pointer: coarse)").matches ||
    window.innerWidth <= 640;

  function searchFold(s) {
    // Skyryba isimama visai, ne paverciama tarpu. Albumas "O'ringen (2006)" su
    // paieska "o-ring" nesutapdavo: apostrofas ir bruksnys - skirtingi zenklai,
    // o naudotojas ju neatspes. Isemus juos abi puses virsta "oringen2006" ir
    // "oring", ir sutapimas randamas. Tarpai isimami taip pat, todel veikia ir
    // "klajuno taure", ir "klajunotaure".
    return String(s).toLowerCase().normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, "");
  }

  // Paieska pagal zodzius bet kokia tvarka: "finalai 2019", "2019 finalai" ir
  // "moletu finalai 2019" randa "Molėtų taurės finalai (2019)". Kiekvienas
  // uzklausos zodis turi buti kurio nors albumo zodzio pradzia (taure -> taurės).
  // Pirmiausia ieskom tik pavadinime, paantrasteje ir datoje; vieta ir zymes
  // naudojamos tik jei ten nieko nerasta - kitaip "vilniaus taure" rastu ir
  // "Klubų taurė" (vieta "Vilniaus r.").
  function searchTokens(q) {
    return String(q).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .split(/[^a-z0-9]+/).filter(Boolean);
  }
  function tokensIn(words, toks) {
    return toks.every(t => words.some(w => w.startsWith(t)));
  }
  // Pavadinimas ir paantraste tikrinami atskirai (kiekvienas su data), ne
  // sujungti - kitaip "vilniaus taure" rastu "Vilniaus Žalgirio atviros
  // varžybos" (paantraste "Žalgirio taurė").
  function albumWordSets(al) {
    if (!al._sw) {
      const date = (al.eventDate || "") + " " + (al.eventDateLabel || "");
      al._sw = {
        strict: [al.name + " " + date, (al.subtitle || "") + " " + date].map(searchTokens),
        broad: searchTokens([al.name, al.subtitle || "", date, al.eventPlace || "",
                             (al.tags || []).join(" ")].join(" "))
      };
    }
    return al._sw;
  }
  function albumSearch(list, toks) {
    if (!toks.length) return list;
    const strict = list.filter(al => albumWordSets(al).strict.some(w => tokensIn(w, toks)));
    return strict.length ? strict : list.filter(al => tokensIn(albumWordSets(al).broad, toks));
  }

  function filteredAlbums() {
    const toks = searchTokens($("q").value);
    const tag = $("tagFilter").value;
    let list = albumSearch(ALBUMS.filter(al => !tag || (al.tags || []).includes(tag)), toks);
    const d = al => al.eventDate || "0000";
    const so = al => Number.isFinite(al.sortOrder) ? al.sortOrder : Number.MAX_SAFE_INTEGER;
    const tie = (a, b) => so(a) - so(b) || a.name.localeCompare(b.name, "lt");
    const cmp = {
      event_desc: (a, b) => d(b).localeCompare(d(a)) || tie(a, b),
      event_asc: (a, b) => d(a).localeCompare(d(b)) || tie(a, b),
      title_asc: (a, b) => a.name.localeCompare(b.name, "lt") || tie(a, b),
      title_desc: (a, b) => b.name.localeCompare(a.name, "lt") || tie(a, b),
      photos_desc: (a, b) => (b.count || 0) - (a.count || 0) || tie(a, b),
      views_desc: (a, b) => (b.siteViewCount || 0) - (a.siteViewCount || 0) || tie(a, b)
    }[$("sort").value];
    return list.sort(cmp);
  }

  /* Metaeilutė kaip administravimo tinklelyje: atskiri elementai su tarpais,
     o ne sujungti taškais. Vietovė gauna savo ženklą, todėl akis ją randa
     iškart, nesvarbu kokio ilgio prieš tai einanti data. Grąžina HTML. */
  // Lietuviška daugiskaita: 1 apsilankymas, 2–9 apsilankymai, 10–20 ir x0 apsilankymų.
  function visitsWord(n) {
    const t = n % 100, u = n % 10;
    if (u === 1 && t !== 11) return "apsilankymas";
    if (u >= 2 && u <= 9 && (t < 12 || t > 19)) return "apsilankymai";
    return "apsilankymų";
  }

  function albumMetaLine(al) {
    const bits = [];
    if (dateLabel(al)) bits.push(`<span>${esc(dateLabel(al))}</span>`);
    if (al.eventPlace) bits.push(`<span class="place">◈ ${esc(al.eventPlace)}</span>`);
    if (al.siteViewCount) bits.push(`<span>${fmtN(al.siteViewCount)} ${visitsWord(al.siteViewCount)}</span>`);
    return bits.join("");
  }

  function renderArchive() {
    const list = filteredAlbums();
    const g = $("albumGrid");
    g.innerHTML = "";
    list.forEach((al, i) => {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.style.animationDelay = Math.min(i * 30, 400) + "ms";
      card.setAttribute("aria-label", "Atidaryti albumą " + al.name + (al.private ? " (privatus)" : ""));
      const cover = al.private
        ? `<div class="lock-cover"><div><b aria-hidden="true">&#128274;</b><br>Privatus albumas</div></div>`
        : al.coverThumbUrl
        ? `<img loading="lazy" src="${esc(al.coverThumbUrl)}" alt="">`
        : `<div class="empty-cover" style="display:grid;place-items:center;height:100%;color:var(--ink-faint);font-size:13px">be viršelio</div>`;
      const my = monthYear(al.eventDate);
      const activeTag = $("tagFilter").value;
      const tags = al.tags || [];
      const tagsRow = tags.length
        ? `<div class="card-tags">${tags.slice(0, 3).map(t =>
            `<span class="tag-mini${t === activeTag ? " on" : ""}" data-tag="${esc(t)}" title="Filtruoti pagal ${esc(t)}">${esc(t)}</span>`
          ).join("")}${tags.length > 3 ? `<span class="tag-mini more">+${tags.length - 3}</span>` : ""}</div>`
        : "";
      card.innerHTML =
        `<div class="thumb">${cover}${al.private ? `<span class="badge badge-private">&#128274; Privatus</span>` : ""}<span class="badge">${al.count || 0}</span>${my ? `<span class="badge badge-date">${esc(my)}</span>` : ""}</div>
         <div class="card-meta">
           <div class="title">${esc(al.name)}</div>
           <div class="sub">${albumMetaLine(al)}</div>
           ${tagsRow}
         </div>`;
      card.onclick = () => openAlbum(al);
      card.querySelectorAll(".tag-mini[data-tag]").forEach(ch => {
        ch.onclick = e => {
          e.stopPropagation();
          const t = ch.dataset.tag;
          $("tagFilter").value = $("tagFilter").value === t ? "" : t;
          renderArchive();
        };
      });
      markLoaded(card.querySelector(".thumb img"));
      g.appendChild(card);
    });
    const total = ALBUMS.reduce((s, a) => s + (a.count || 0), 0);
    $("status").textContent = !list.length
      ? "Pagal paiešką nieko nerasta."
      : (list.length === ALBUMS.length
          ? `${ALBUMS.length} albumai · ${fmtN(total)} nuotraukų`
          : `${list.length} / ${ALBUMS.length} albumų`)
        + (favs.size && !compactUI() ? ` · ${favs.size} ♥` : "");
  }

  // ================= Album =================
  async function openAlbum(al) {
    currentAlbum = al;
    favsOnly = false;
    syncFavChip();
    pushHistory({ v: "album", path: al.path, d: 1 });
    $("viewArchive").hidden = true;
    $("viewAlbum").hidden = false;
    $("tagWrap").style.display = "none";
    $("sortWrap").style.display = "none";
    $("q").value = ""; syncQClear();
    window.scrollTo(0, 0);
    $("albumTitle").textContent = al.name;
    renderAlbumSub(al);
    const oldBar = $("privateBar");
    if (oldBar) oldBar.remove();
    photos = [];
    visible = [];
    renderedCount = 0;
    nextCursor = "";
    $("photoGrid").innerHTML = "";
    $("empty").style.display = "none";
    $("status").textContent = "";
    await fetchPhotos();
  }

  function renderAlbumSub(al) {
    const bits = [];
    if (dateLabel(al)) bits.push(`<span>${esc(dateLabel(al))}</span>`);
    if (al.eventPlace) bits.push(`<span class="d">·</span><span>${esc(al.eventPlace)}</span>`);
    bits.push(`<span class="d">·</span><span id="subCount">${al.count || 0} nuotr.</span>`);
    // „19 apsilankymų, viso peržiūrų: 7 512" – peržiūros = visų albumo nuotraukų suma (Google Photos + svetainė).
    const totalViews = al.imageViewCount ? `viso peržiūrų: ${fmtN(al.imageViewCount)}` : "";
    if (al.siteViewCount) bits.push(`<span class="d">·</span><span>${fmtN(al.siteViewCount)} ${visitsWord(al.siteViewCount)}${totalViews ? ", " + totalViews : ""}</span>`);
    else if (totalViews) bits.push(`<span class="d">·</span><span>${totalViews}</span>`);
    if (al.authorName) bits.push(`<span class="d">·</span><span>Foto: ${esc(al.authorName)}</span>`);
    if (al.copyrightText) bits.push(`<span class="d">·</span><span>${esc(al.copyrightText)}</span>`);
    if (al.private) bits.push(`<span class="tag">&#128274; Privatus</span>`);
    (al.tags || []).forEach(t => bits.push(`<span class="tag">${esc(t)}</span>`));
    $("albumSub").innerHTML = bits.join(" ");
  }

  async function fetchPhotos() {
    if (loadingPhotos || !currentAlbum) return;
    loadingPhotos = true;
    note("Kraunamos nuotraukos…");
    try {
      // Kaip ir albumų sąraše: vienos užklausos kaina beveik nepriklauso nuo
      // nuotraukų kiekio joje (matuota ~62 ms su 60 ir su 200), tad svarbu, kiek
      // kartų tą kainą sumoki. 604 nuotraukų albumas su 60 tai 11 užklausų,
      // su 200 — 4.
      const params = { path: currentAlbum.path, limit: 200 };
      if (nextCursor) params.cursor = nextCursor;
      const d = await api(params);
      if (d.locked) { showLocked(d); return; }
      if (d.private && !params.cursor) showPrivateBar(d.viewer || "");
      photos.push(...(d.items || []).filter(i => i.type === "photo"));
      nextCursor = d.nextCursor || "";
      applyPhotoFilter(false);
    } catch (e) {
      note("Klaida kraunant: " + e.message);
      toast("Nepavyko užkrauti nuotraukų sąrašo: " + e.message);
      return;
    } finally {
      loadingPhotos = false;
    }
    note(nextCursor ? "Slinkite žemyn — bus užkrauta daugiau" : "");
  }

  // Privatus albumas be teisės: vietoj nuotraukų - kas jas mato ir prisijungimas.
  function showLocked(d) {
    const lg = d.login || {};
    const who = lg.mode === "members" ? "prisijungę klubo nariai ir administratoriai" : "tik administratoriai";
    const url = lg.url || "/login/";
    const emp = $("empty");
    emp.innerHTML = `<div class="private-panel"><h3>&#128274; Privatus albumas</h3><div>Šio albumo nuotraukas mato ${who}.</div>`
      + (lg.signedInAs
          ? `<div style="margin-top:8px">Prisijungta kaip <strong>${esc(lg.signedInAs)}</strong> — ši paskyra prieigos neturi.</div><a class="pill" href="${esc(url)}">Keisti paskyrą</a>`
          : `<a class="pill" href="${esc(url)}">Prisijungti</a>`)
      + `</div>`;
    emp.style.display = "block";
    nextCursor = "";
    note("");
  }

  function showPrivateBar(email) {
    let bar = $("privateBar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "privateBar";
      bar.className = "private-bar";
      $("albumSub").after(bar);
    }
    const ret = encodeURIComponent(currentAlbum && currentAlbum.id ? "/a/id" + currentAlbum.id : "/");
    bar.innerHTML = "&#128274; Privatus albumas"
      + (email ? ` · prisijungta: ${esc(email)} · <a href="/login/?return=${ret}">Atsijungti</a>` : " · matai kaip administratorius");
  }

  function note(text) {
    let el = $("loadNote");
    if (!el) {
      el = document.createElement("div");
      el.id = "loadNote";
      el.className = "loadnote";
      $("sentinel").before(el);
    }
    el.textContent = text;
  }

  // Albumo viduje paieska nuotrauku nefiltruoja - ju vardai techniniai
  // (IMG_1234.jpg). Vietoj to rodomas albumu sarasas (renderSearchDrop).
  function photoPasses(p) {
    if (favsOnly && !favs.has(p.path)) return false;
    return true;
  }

  function applyPhotoFilter(reset) {
    if (reset) { $("photoGrid").innerHTML = ""; renderedCount = 0; }
    visible = photos.filter(photoPasses);
    renderMore();
    const sc = $("subCount");
    if (sc && currentAlbum) {
      const total = currentAlbum.count || photos.length;
      sc.textContent = (visible.length === total ? `${total}` : `${visible.length} / ${total}`) + " nuotr.";
    }
    const emp = $("empty");
    emp.style.display = visible.length ? "none" : "block";
    emp.textContent = favsOnly ? "Šiame albume dar nėra ♥ pažymėtų nuotraukų." : "Pagal paiešką nieko nerasta.";
  }

  // Kito ekrano miniatiūros paruošiamos iš anksto. img.php pirmą kartą užtrunka
  // ~450 ms (parsiunčia originalą iš B2 ir perdaro), o jau paruoštą atiduoda per
  // ~4 ms — tad svarbu ne sumažinti užklausų, o kad tas pirmas kartas įvyktų
  // ANKSČIAU, nei naudotojas nuslinks. Bendras užklausų kiekis nesikeičia: tos
  // pačios miniatiūros būtų užsakytos ir taip, tik vėliau ir laukiant.
  //
  // Lygiagrečių ribojam iki keturių: img.php turi 300 užklausų per minutę ribą,
  // o ir naršyklė vienam serveriui daugiau nei šešias vis tiek neatidaro.
  const prefetchedThumbs = new Set();
  let prefetchBusy = 0;
  const PREFETCH_MAX = 4;
  function prefetchThumbs(from, count) {
    const queue = [];
    for (let i = from; i < Math.min(from + count, visible.length); i++) {
      const u = visible[i] && visible[i].thumbUrl;
      if (u && !prefetchedThumbs.has(u)) { prefetchedThumbs.add(u); queue.push(u); }
    }
    const pump = () => {
      while (prefetchBusy < PREFETCH_MAX && queue.length) {
        const u = queue.shift();
        prefetchBusy++;
        const im = new Image();
        const done = () => { prefetchBusy--; pump(); };
        im.onload = done;
        im.onerror = done;
        im.src = u;
      }
    };
    pump();
  }

  function renderMore() {
    const g = $("photoGrid");
    const end = Math.min(renderedCount + CHUNK, visible.length);
    for (let vi = renderedCount; vi < end; vi++) {
      const p = visible[vi];
      const on = favs.has(p.path);
      const card = document.createElement("figure");
      card.className = "pcard";
      const issue = previewIssue(p);
      const media = issue
        ? `<div class="no-preview"><span class="np-ico">⚠</span>${esc(issue)}</div>`
        : `<img class="ph" loading="lazy" src="${esc(p.thumbUrl)}" alt="${esc(p.name)}">`;
      card.innerHTML =
        media +
        `<figcaption class="pmeta"><span>${esc(p.name)}</span><span>${esc(fmtBytes(p.originalSize))}</span></figcaption>` +
        `<span class="pindex">${vi + 1} / <span class="pindex-total"></span></span>` +
        `<button class="fav-btn${on ? " on" : ""}" title="Įsiminti">${on ? "♥" : "♡"}</button>`;
      card.querySelector(".fav-btn").onclick = e => { e.stopPropagation(); toggleFav(p.path); };
      card.onclick = () => openLb(vi);
      const gridIm = card.querySelector("img.ph");
      if (gridIm) {
        markLoaded(gridIm);
        // img.php grazina 503, kai ta pacia miniatiura tuo metu generuoja kita
        // uzklausa. Be pakartojimo viena tokia nesekme plytele sugadindavo iki
        // puslapio perkrovimo. "retry" parametro img.php neskaito, tad serverio
        // podelio raktas nesikeicia - grazinama ta pati miniatiura.
        let bandyta = false;
        gridIm.onerror = () => {
          if (!bandyta) {
            bandyta = true;
            const u = gridIm.src;
            setTimeout(() => { gridIm.src = u + (u.includes("?") ? "&" : "?") + "retry=1"; }, 900);
            return;
          }
          gridIm.replaceWith(Object.assign(document.createElement("div"), {
            className: "no-preview",
            innerHTML: '<span class="np-ico">⚠</span>Nepavyko užkrauti peržiūros'
          }));
        };
      }
      g.appendChild(card);
    }
    renderedCount = end;
    prefetchThumbs(end, CHUNK);   // kitas ekranas ruošiamas fone
    // Totals are only known progressively (cursor pagination), so every badge's
    // "/ N" is rewritten here — otherwise tiles rendered before later pages
    // arrive would keep a stale, too-small total. With no filter active the
    // album's full published count is authoritative and correct from the first
    // tile; a favourites/search filter narrows to the loaded set, so use that.
    const filtered = favsOnly;
    const total = filtered ? visible.length : (currentAlbum && currentAlbum.count) || visible.length;
    g.querySelectorAll(".pindex-total").forEach(el => { el.textContent = total; });
  }

  function backToArchive() {
    currentAlbum = null;
    $("viewAlbum").hidden = true;
    $("viewArchive").hidden = false;
    $("tagWrap").style.display = "";
    $("sortWrap").style.display = "";
    note("");
    renderArchive();
  }

  function toggleFav(path) {
    favs.has(path) ? favs.delete(path) : favs.add(path);
    saveFavs();
    applyPhotoFilter(true);
    if ($("lb").classList.contains("open")) { syncLbFav(); renderInfo(); }
  }

  function syncFavChip() {
    const b = $("favFilter");
    b.classList.toggle("active", favsOnly);
    b.textContent = (favsOnly ? "♥" : "♡") + " Tik įsiminti";
  }

  // ================= Infinite scroll =================
  // IntersectionObserver praneša tik apie ribos KIRTIMĄ. Užkrovus vieną dalį
  // žymeklis dažniausiai lieka matomas (ypač kai dalis maža arba langas
  // aukštas), naujo įvykio nebūna, ir slinkimas užstringa ties užrašu
  // „bus užkrauta daugiau" – nors likusios nuotraukos yra. Todėl po kiekvieno
  // įkėlimo patys pasitikrinam, ar žymeklis vis dar matomas, ir kraunam toliau.
  let scrollBusy = false;
  async function loadMoreIfNeeded() {
    if (scrollBusy || currentAlbum === null) return;
    const el = $("sentinel");
    if (!el) return;
    scrollBusy = true;
    try {
      let guard = 0;
      while (guard++ < 40) {
        const r = el.getBoundingClientRect();
        if (r.top > window.innerHeight + 700) break;      // žymeklis toli – gana
        if (renderedCount < visible.length) renderMore();
        else if (nextCursor && !loadingPhotos) await fetchPhotos();
        else break;                                        // daugiau nėra ko krauti
        await new Promise(requestAnimationFrame);
      }
    } finally {
      scrollBusy = false;
    }
  }
  new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    loadMoreIfNeeded();
  }, { rootMargin: "700px" }).observe($("sentinel"));
  // Atsarginis kelias: jei stebėtojas dėl kokios nors priežasties nesuveikia,
  // slinkimas vis tiek pakrauna.
  window.addEventListener("scroll", () => { loadMoreIfNeeded(); }, { passive: true });

  // ================= Lightbox =================
  function openLb(vi) {
    lbIndex = vi;
    updateLb();
    $("lb").classList.add("open");
    pushHistory({ v: "photo", path: currentAlbum ? currentAlbum.path : "", i: vi, d: 2 });
  }
  function closeLb() { $("lb").classList.remove("open"); }

  // ================= Browser history + shareable URLs =================
  // Archive → album → photo each get a history entry (Back steps up one level)
  // AND a real URL (?a=album&f=N), so any view can be reloaded or shared.
  let suppressHistory = false;
  const BASE_TITLE = document.title;

  function urlForState(st) {
    if (!st || st.v === "archive" || !st.path) return location.pathname;
    const q = "?a=" + encodeURIComponent(st.path);
    return location.pathname + (st.v === "photo" ? q + "&f=" + ((st.i | 0) + 1) : q);
  }

  function syncTitle(st) {
    if (!st || st.v === "archive" || !currentAlbum) { document.title = BASE_TITLE; return; }
    if (st.v === "photo" && visible[st.i | 0]) {
      document.title = visible[st.i | 0].name + " — " + currentAlbum.name;
    } else {
      document.title = currentAlbum.name + " — foto.klajunas.lt";
    }
  }

  function pushHistory(st) {
    if (suppressHistory) return;
    history.pushState(st, "", urlForState(st));
    syncTitle(st);
  }

  async function applyHistoryState(st) {
    const target = st && st.v ? st.v : "archive";
    const lbIsOpen = $("lb").classList.contains("open");
    const al = target === "archive" ? null : (ALBUMS || []).find(a => a.path === st.path);

    suppressHistory = true;
    try {
      if (target === "archive") {
        if (lbIsOpen) closeLb();
        if (currentAlbum) backToArchive();
        return;
      }
      // Re-open the album only if we are not already inside it (e.g. after a
      // forward navigation or a reload); going photo → album just closes the box.
      if (!currentAlbum || currentAlbum.path !== st.path) {
        if (!al) { backToArchive(); return; }
        await openAlbum(al);
      }
      if (target === "album") {
        if ($("lb").classList.contains("open")) closeLb();
      } else if (target === "photo") {
        const i = Math.min(Math.max(0, st.i | 0), Math.max(0, visible.length - 1));
        openLb(i);
      }
    } finally {
      suppressHistory = false;
      syncTitle(st);
    }
  }

  // Deep link on load: /?a=<albumPath>&f=<nuotraukos numeris nuo 1>.
  // Params are captured BEFORE the initial replaceState below strips them from
  // the address bar (otherwise the deep link would be erased before it is read).
  const INITIAL_SEARCH = location.search;
  async function openFromUrl() {
    const params = new URLSearchParams(INITIAL_SEARCH);
    const a = params.get("a");
    if (!a) return;
    const al = (ALBUMS || []).find(x => x.path === a);
    if (!al) return;
    await openAlbum(al);
    const f = parseInt(params.get("f") || "0", 10);
    if (f >= 1) {
      let guard = 0;
      while (visible.length < f && nextCursor && guard++ < 40) await fetchPhotos();
      if (visible.length) openLb(Math.min(f, visible.length) - 1);
    }
  }

  window.addEventListener("popstate", e => { applyHistoryState(e.state); });
  history.replaceState({ v: "archive", d: 0 }, "", location.pathname);
  function step(d) {
    if (!visible.length) return;
    lbIndex = (lbIndex + d + visible.length) % visible.length;
    updateLb();
  }

  // Swipe left/right on the photo stage to move between photos (touch devices).
  (function enableSwipe() {
    const stage = document.querySelector(".lb-stage");
    if (!stage) return;
    let x0 = null, y0 = null;
    stage.addEventListener("touchstart", e => {
      if (e.touches.length !== 1) { x0 = null; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    stage.addEventListener("touchend", e => {
      if (x0 === null || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      // horizontal, long enough, and not a vertical scroll
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
      x0 = null;
    }, { passive: true });
  })();
  // Didinimas dideliems ekranams. Elgsena kaip Google Photos: ratukas didina ties
  // pele, tempimas slankioja, dvigubas spustelejimas perjungia, Esc grazina.
  // Siauruose ekranuose neijungiam - ten vaizdui valdyti naudojami tie patys
  // pirstu judesiai kaip nuotrauku perjungimui, ir jie vienas kitam trukdytu.
  const ZOOM_MIN = 1, ZOOM_MAX = 4, ZOOM_STEP = 2.5;
  let zScale = 1, zX = 0, zY = 0, zDrag = null;

  function zoomEnabled() { return window.matchMedia("(min-width: 901px)").matches; }
  function zoomImg() { return $("lbImg").querySelector("img"); }

  function zoomApply() {
    const box = $("lbImg"), im = zoomImg();
    if (!im) return;
    // Slankiojimas ribojamas tiek, kiek vaizdas isauga: uz remeliu jis neiseina.
    const ox = Math.max(0, (zScale - 1) * im.offsetWidth / 2);
    const oy = Math.max(0, (zScale - 1) * im.offsetHeight / 2);
    zX = Math.min(ox, Math.max(-ox, zX));
    zY = Math.min(oy, Math.max(-oy, zY));
    im.style.transform = "translate(" + zX + "px," + zY + "px) scale(" + zScale + ")";
    box.classList.toggle("zoomed", zScale > 1.01);
    zoomBadge(box).textContent = zScale.toFixed(1) + "×";
  }

  function zoomReset() {
    zScale = 1; zX = 0; zY = 0;
    const box = $("lbImg"), im = zoomImg();
    if (im) im.style.transform = "";
    box.classList.remove("zoomed", "dragging");
    box.classList.toggle("zoomable", zoomEnabled());
    zoomBadge(box);
  }

  // Zenklas kuriamas cia, o ne zoomReset() pabaigoje: updateLb() pirma perraso
  // viso lango turini per innerHTML, ir anksciau sukurtas zenklas dingtu kartu.
  // Taip jis atsiranda tada, kai reikia, ir eiliskumas nebesvarbus.
  function zoomBadge(box) {
    let b = box.querySelector(".lb-zoom-badge");
    if (!b) { b = document.createElement("div"); b.className = "lb-zoom-badge"; box.appendChild(b); }
    return b;
  }

  // Taskas po pele turi likti vietoje: perskaiciuojam poslinki pagal nauja masteli.
  function zoomAt(k2, cx, cy) {
    const im = zoomImg();
    if (!im) return;
    k2 = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, k2));
    const r = im.getBoundingClientRect();
    const ccx = r.left + r.width / 2 - zX, ccy = r.top + r.height / 2 - zY;
    zX = cx - ccx - ((cx - ccx - zX) / zScale) * k2;
    zY = cy - ccy - ((cy - ccy - zY) / zScale) * k2;
    zScale = k2;
    if (zScale <= 1.01) { zScale = 1; zX = 0; zY = 0; }
    zoomApply();
  }

  (function enableZoom() {
    const box = $("lbImg");
    if (!box) return;
    box.addEventListener("wheel", e => {
      if (!zoomEnabled() || !zoomImg()) return;
      e.preventDefault();
      zoomAt(zScale * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY);
    }, { passive: false });
    box.addEventListener("dblclick", e => {
      if (!zoomEnabled() || !zoomImg()) return;
      e.preventDefault();
      zoomAt(zScale > 1.01 ? 1 : ZOOM_STEP, e.clientX, e.clientY);
    });
    box.addEventListener("mousedown", e => {
      if (zScale <= 1.01 || e.button !== 0) return;
      e.preventDefault();
      zDrag = { x: e.clientX - zX, y: e.clientY - zY };
      box.classList.add("dragging");
    });
    window.addEventListener("mousemove", e => {
      if (!zDrag) return;
      zX = e.clientX - zDrag.x; zY = e.clientY - zDrag.y;
      zoomApply();
    });
    window.addEventListener("mouseup", () => {
      zDrag = null;
      $("lbImg").classList.remove("dragging");
    });
    // Nuotrauka i <img> idedama ne is karto, o uzsikrovus - tada matmenys jau
    // zinomi ir ribos skaiciuojamos teisingai.
    window.addEventListener("resize", () => { if (zScale > 1.01) zoomApply(); });
  })();

  // Svetainės peržiūrų skaitiklis (photos.site_views): ta pati nuotrauka
  // skaičiuojama vieną kartą per naršyklės sesiją; privačiuose albumuose – ne.
  function recordPhotoView(p) {
    if (!p || !p.path || (currentAlbum && currentAlbum.private)) return;
    let seen = {};
    try { seen = JSON.parse(sessionStorage.getItem("fotoSeen") || "{}") || {}; } catch (e) {}
    if (seen[p.path]) return;
    seen[p.path] = 1;
    try { sessionStorage.setItem("fotoSeen", JSON.stringify(seen)); } catch (e) {}
    const url = API + "?action=photo_view", body = new URLSearchParams({ file: p.path });
    try {
      if (!(navigator.sendBeacon && navigator.sendBeacon(url, body))) fetch(url, { method: "POST", body, keepalive: true }).catch(() => {});
    } catch (e) {}
  }

  function updateLb() {
    const p = visible[lbIndex];
    if (!p) return closeLb();
    recordPhotoView(p);
    const lbIssue = previewIssue(p);
    if (lbIssue) {
      const dlHtml = (p.downloadAllowed && p.downloadUrl)
        ? `<br><br><a class="back-pill show" style="display:inline-block" href="${esc(p.downloadUrl)}" target="_blank" rel="noopener">⤓ Atsisiųsti originalą</a>`
        : "";
      $("lbImg").innerHTML = `<div class="lb-notice"><span class="np-ico">⚠</span>${esc(lbIssue)}${dlHtml}</div>`;
    } else {
      $("lbImg").innerHTML = `<div class="spinner" aria-label="Kraunama"></div><img src="${esc(p.viewUrl)}" alt="${esc(p.name)}">`;
      const lbIm = $("lbImg").querySelector("img");
      const lbDone = () => { lbIm.classList.add("loaded"); $("lbImg").querySelector(".spinner")?.remove(); };
      let lbBandyta = false;
      const lbFail = () => {
        if (!lbBandyta) {
          lbBandyta = true;
          const u = lbIm.src;
          setTimeout(() => { lbIm.src = u + (u.includes("?") ? "&" : "?") + "retry=1"; }, 900);
          return;
        }
        $("lbImg").innerHTML = `<div class="lb-notice"><span class="np-ico">⚠</span>Nepavyko užkrauti nuotraukos „${esc(p.name)}“. Pabandykite dar kartą.</div>`;
        toast("Nepavyko užkrauti nuotraukos: " + p.name);
      };
      if (lbIm.complete && lbIm.naturalWidth) lbDone();
      else { lbIm.onload = lbDone; lbIm.onerror = lbFail; }
    }
    zoomReset();
    $("lbTitle").textContent = p.name;
    // title - kad ir nukirptas pavadinimas butu prieinamas visas.
    $("lbTag").textContent = currentAlbum ? currentAlbum.name : "";
    $("lbTag").title = currentAlbum ? currentAlbum.name : "";
    sizeLbAlbum();
    $("lbCounter").textContent = `${lbIndex + 1} / ${visible.length}`;
    const dl = $("lbDown");
    if (p.downloadAllowed && p.downloadUrl) { dl.style.display = ""; dl.title = "Atsisiųsti originalą"; }
    else dl.style.display = "none";
    syncLbFav();
    renderInfo();
  }
  function syncLbFav() {
    const p = visible[lbIndex];
    if (!p) return;
    const on = favs.has(p.path);
    $("lbFav").textContent = on ? "♥" : "♡";
    $("lbFav").classList.toggle("on", on);
  }

  async function renderInfo() {
    const p = visible[lbIndex];
    if (!p || !currentAlbum) return;
    const rows = [
      currentAlbum.subtitle ? ["Paantraštė", currentAlbum.subtitle] : null,
      ["Albumas", currentAlbum.name],
      ["Nuotrauka", p.name],
      currentAlbum.eventPlace ? ["Vieta", currentAlbum.eventPlace] : null,
      dateLabel(currentAlbum) ? ["Renginio data", dateLabel(currentAlbum)] : null,
      p.originalSize ? ["Dydis", fmtBytes(p.originalSize)] : null,
      compactUI() ? null : ["Įsiminta", favs.has(p.path) ? "♥ taip" : "—"],
    ].filter(Boolean);
    drawInfo(rows.concat([["…", "kraunama EXIF"]]));

    let meta = metaCache.get(p.path);
    if (meta === undefined && p.metaUrl) {
      try {
        const r = await fetch(p.metaUrl, { headers: { Accept: "application/json" } });
        meta = r.ok ? await r.json() : null;
      } catch (e) { meta = null; }
      metaCache.set(p.path, meta);
    }
    if (visible[lbIndex] !== p) return;
    const extra = [];
    if (meta) {
      const exif = meta.exif || {};
      const taken = (exif.dateTaken || "").replace(/^([0-9]{4}):([0-9]{2}):([0-9]{2})/, "$1-$2-$3");
      if (meta.title && meta.title !== p.name) extra.push(["Antraštė", meta.title]);
      if (meta.description) extra.push(["Aprašymas", meta.description]);
      if (taken) extra.push(["Fotografuota", taken]);
      const cam = [exif.cameraMake, exif.cameraModel].filter(Boolean).join(" ");
      if (cam) extra.push(["Kamera", cam]);
      const v = meta.imageViews ?? meta.views;
      if (v !== undefined && v !== null && v !== "") extra.push(["Peržiūros", fmtN(v)]);
    }
    const tail = [];
    if (currentAlbum.description) tail.push(["Aprašymas", currentAlbum.description]);
    const links = [
      ["DB sportas", currentAlbum.dbsportasUrl],
      ["klajunas.lt", currentAlbum.klajunasUrl],
      ["Kita nuoroda", currentAlbum.otherUrl],
    ].filter(([, u]) => u);
    links.forEach(([k, u]) => tail.push([k, { link: u }]));
    drawInfo(rows.concat(extra).concat(tail));
  }

  function drawInfo(rows) {
    $("infoTable").innerHTML = rows
      .map(([k, v]) => {
        if (v && typeof v === "object" && v.link) {
          return `<tr><td class="k">${esc(k)}</td><td class="v"><a href="${esc(v.link)}" target="_blank" rel="noopener noreferrer" style="color:var(--amber-ink);text-decoration:underline;text-underline-offset:2px;word-break:break-all">${esc(v.link.replace(/^https?:\/\//, ""))}</a></td></tr>`;
        }
        return `<tr><td class="k">${esc(k)}</td><td class="v">${esc(v)}</td></tr>`;
      })
      .join("");
  }

  // ================= Events =================
  // Logo returns to the archive, unwinding however deep we are, so the Back
  // button afterwards still leads out of the site rather than back into an album.
  $("btnBrand").onclick = () => {
    $("q").value = ""; $("tagFilter").value = ""; $("sort").value = "event_desc"; syncQClear();
    const depth = (history.state && history.state.d) || 0;
    if (depth > 0) history.go(-depth); else renderArchive();
  };
  $("btnBack").onclick = () => history.back();
  $("themeToggle").onclick = () => {
    const dark = document.body.classList.toggle("dark");
    $("themeToggle").textContent = dark ? "◑ Light" : "◐ Dark";
  };
  // Admin panel is desktop-only: drop the entry point on phones/tablets.
  // Covers iPadOS, which reports itself as "Macintosh" but exposes touch points.
  const isTouchDevice =
    window.matchMedia("(hover: none) and (pointer: coarse)").matches ||
    /Android|iPhone|iPod|iPad|Mobile|Tablet|Silk|Kindle|Opera Mini|IEMobile/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform || ""));

  if (isTouchDevice) {
    const ab = $("btnAdmin"); if (ab) ab.remove();
    const ap = $("adminPanel"); if (ap) ap.remove();
  } else {
    // btnAdmin dabar footeryje ir yra <a href="/admin/"> - naršyklė nuveda pati.
    $("btnAdminClose").onclick = () => { $("adminPanel").hidden = true; };
  }
  $("favFilter").onclick = () => { favsOnly = !favsOnly; syncFavChip(); applyPhotoFilter(true); };
  $("vSmall").onclick = () => setView(false);
  $("vLarge").onclick = () => setView(true);
  function setView(large) {
    $("photoGrid").classList.toggle("large", large);
    $("vSmall").classList.toggle("active", !large);
    $("vLarge").classList.toggle("active", large);
  }
  // Valymo mygtukas. Rodomas tik kai yra ka valyti, o paspaudus fokusas grazinamas
  // i lauka - kitaip po valymo tektu spusteleti dar karta, kad butu galima rasyti.
  function syncQClear() {
    const b = $("qClear");
    if (b) b.hidden = $("q").value === "";
  }
  // Albumo viduje paieska rodo albumu sarasa po lauku; paspaudus (ar Enter)
  // atidaromas albumas. Archyve - filtruojamas pats albumu tinklelis.
  let dropIndex = 0;
  function searchDropMatches() {
    const toks = searchTokens($("q").value);
    if (!toks.length) return [];
    return albumSearch(ALBUMS, toks).slice()
      .sort((a, b) => String(b.eventDate || "").localeCompare(String(a.eventDate || "")))
      .slice(0, 12);
  }
  function hideSearchDrop() { const d = $("qDrop"); if (d) { d.hidden = true; d.innerHTML = ""; } }
  function renderSearchDrop() {
    const d = $("qDrop");
    if (!d) return;
    if (currentAlbum === null || $("q").value.trim() === "") { hideSearchDrop(); return; }
    const list = searchDropMatches();
    d.innerHTML = "";
    if (!list.length) {
      const e = document.createElement("div"); e.className = "q-drop-empty"; e.textContent = "Albumų nerasta";
      d.appendChild(e);
    }
    dropIndex = Math.min(dropIndex, Math.max(0, list.length - 1));
    list.forEach((al, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = i === dropIndex ? "act" : "";
      b.textContent = al.name;
      if (al.eventDateLabel || al.eventDate) {
        const sm = document.createElement("small"); sm.textContent = al.eventDateLabel || al.eventDate; b.appendChild(sm);
      }
      b.onmousedown = e => e.preventDefault(); // kad blur nepaslėptų prieš click
      b.onclick = () => { hideSearchDrop(); $("q").value = ""; syncQClear(); openAlbum(al); };
      d.appendChild(b);
    });
    d.hidden = false;
  }
  function runSearch() {
    dropIndex = 0;
    if (currentAlbum === null) { hideSearchDrop(); renderArchive(); } else renderSearchDrop();
  }
  $("q").addEventListener("keydown", e => {
    const d = $("qDrop");
    if (currentAlbum === null || !d || d.hidden) return;
    const items = d.querySelectorAll("button");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      dropIndex = (dropIndex + (e.key === "ArrowDown" ? 1 : -1) + items.length) % Math.max(1, items.length);
      items.forEach((b, i) => b.classList.toggle("act", i === dropIndex));
    } else if (e.key === "Enter") {
      e.preventDefault(); if (items[dropIndex]) items[dropIndex].click();
    } else if (e.key === "Escape") { hideSearchDrop(); }
  });
  $("q").addEventListener("blur", () => setTimeout(hideSearchDrop, 150));
  $("q").addEventListener("focus", () => { if (currentAlbum !== null) renderSearchDrop(); });
  $("q").oninput = () => { syncQClear(); runSearch(); };
  if ($("qClear")) $("qClear").onclick = () => { $("q").value = ""; syncQClear(); runSearch(); $("q").focus(); };
  syncQClear();
  $("tagFilter").onchange = renderArchive;
  $("sort").onchange = renderArchive;

  $("lbClose").onclick = () => history.back();
  $("lbBack").onclick = () => history.back();
  $("lbPrev").onclick = () => step(-1);
  $("lbNext").onclick = () => step(1);
  $("lbFav").onclick = () => { const p = visible[lbIndex]; if (p) toggleFav(p.path); };
  $("lbDown").onclick = () => { const p = visible[lbIndex]; if (p && p.downloadAllowed && p.downloadUrl) window.open(p.downloadUrl, "_blank", "noopener"); };
  // Dalinamės nuoroda pagal albumo ID (/a/id<N>), o ne pagal slug'ą: pavadinimai
  // ir keliai laikui bėgant tikslinami, ID nesikeičia niekada. og.php pagal ID
  // pasiima dabartinį slug'ą, tad kartą išsiųsta nuoroda nemiršta po pervadinimo.
  // Seni albumai be ID (jei API jo negrąžintų) krenta atgal į slug'ą.
  function shareUrl(al, photoNo) {
    const token = al && al.id ? "id" + al.id : encodeURIComponent(al ? al.path : "");
    return location.origin + "/a/" + token + (photoNo >= 1 ? "?f=" + photoNo : "");
  }

  // /a/<žetonas> eina per og.php — dalinantis WhatsApp/FB rodo viršelį ir pavadinimą.
  async function shareLink(url, title, confirmFn) {
    if (navigator.share) {
      try { await navigator.share({ title, url }); } catch (e) { /* atsisakė — ok */ }
    } else {
      try { await navigator.clipboard.writeText(url); confirmFn(); }
      catch (e) { prompt("Kopijuok nuorodą:", url); }
    }
  }
  $("lbShare").onclick = () => {
    if (!currentAlbum) return;
    const url = shareUrl(currentAlbum, lbIndex >= 0 ? lbIndex + 1 : 0);
    shareLink(url, currentAlbum.name, () => {
      const b = $("lbShare"), old = b.innerHTML;
      b.innerHTML = "✓";
      setTimeout(() => { b.innerHTML = old; }, 1200);
    });
  };
  $("albumShare").onclick = () => {
    if (!currentAlbum) return;
    const url = shareUrl(currentAlbum, 0);
    shareLink(url, currentAlbum.name, () => {
      const l = $("albumShareLabel"), old = l.textContent;
      l.textContent = "Nukopijuota ✓";
      setTimeout(() => { l.textContent = old; }, 1400);
    });
  };
  function syncInfoOpen() {
    $("lb").classList.toggle("info-open", $("infoPanel").classList.contains("show"));
    sizeLbAlbum();
  }
  // Virsutines juostos aukstis keliauja i --topbar-h, kad po ja galetu prilipti
  // albumo juosta. Matuojam, o ne rasom skaiciaus: siaurame ekrane paieskos
  // laukas persilauzia i antra eilute ir juosta paauksteja.
  const topbarEl = document.querySelector(".topbar");
  function syncTopbarHeight() {
    if (!topbarEl) return;
    document.documentElement.style.setProperty("--topbar-h", topbarEl.getBoundingClientRect().height + "px");
  }
  // Perziuros antrastes plotis. Albumo pavadinimas svarbesnis uz failo varda:
  // pirma jam atiduodama vieta (riboja tik desines mygtukai - dezute centruota,
  // tad ji simetriska), o failo vardui lieka tai, kas kaireje dar laisva, ir jis
  // nukerpamas su "...". Anksciau buvo atvirksciai - ilgas failo vardas
  // ("825329923_1804401968356232_..._n.jpg") suspausdavo albuma iki 160 px ir
  // vis tiek ant jo uzlipdavo.
  function sizeLbAlbum() {
    const tag = $("lbTag");
    const left = document.querySelector(".lb-left");
    if (!tag || !left) return;
    if (!tag.offsetParent || !tag.textContent.trim()) { left.style.maxWidth = ""; return; }   // iki 900 px ji paslepta
    const bar = document.querySelector(".lb-top");
    const acts = document.querySelector(".lb-actions");
    if (!bar || !acts) return;
    const GAP = 16;
    const box = bar.getBoundingClientRect();
    const shift = parseFloat(getComputedStyle(tag).marginLeft) || 0;
    const centre = box.left + box.width / 2 + shift;
    const room = acts.getBoundingClientRect().left - centre - GAP;
    tag.style.maxWidth = Math.max(160, room * 2) + "px";
    const half = tag.getBoundingClientRect().width / 2;
    const leftRoom = centre - half - GAP - left.getBoundingClientRect().left;
    left.style.maxWidth = Math.max(90, leftRoom) + "px";
  }
  syncTopbarHeight();
  window.addEventListener("resize", () => { syncTopbarHeight(); sizeLbAlbum(); });
  if (window.ResizeObserver && topbarEl) new ResizeObserver(syncTopbarHeight).observe(topbarEl);
  $("lbInfo").onclick = () => {
    $("infoPanel").classList.toggle("show");
    $("lbInfo").classList.toggle("on");
    syncInfoOpen();
  };
  $("infoClose").onclick = () => {
    $("infoPanel").classList.remove("show");
    $("lbInfo").classList.remove("on");
    syncInfoOpen();
  };
  $("lb").onclick = e => { if (e.target === $("lb")) history.back(); };

  document.addEventListener("keydown", e => {
    const lbOpen = $("lb").classList.contains("open");
    if (e.key === "Escape") {
      // Padidinus Esc pirma grazina masteli, ir tik tada uzdaro - kaip Google
      // Photos. Kitaip is padidinto vaizdo isskristum tiesiai i albuma.
      if (lbOpen && zScale > 1.01) { zoomReset(); return; }
      if (lbOpen || currentAlbum !== null) history.back();
      return;
    }
    if (!lbOpen) return;
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
    if (e.key.toLowerCase() === "f") { const p = visible[lbIndex]; if (p) toggleFav(p.path); }
    if (e.key.toLowerCase() === "i") $("lbInfo").click();
  });

  let swipeX = null;
  $("lb").addEventListener("touchstart", e => { swipeX = e.touches[0].clientX; }, { passive: true });
  $("lb").addEventListener("touchend", e => {
    if (swipeX === null) return;
    const dx = e.changedTouches[0].clientX - swipeX;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
    swipeX = null;
  }, { passive: true });

  loadAlbums();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
