; Nariu ikelimas prima telefono originalus - numatytieji 2-8 MB per mazi.
; Failai keliami po viena, todel post_max_size uztenka vieno failo dydzio.
; Ribos turi buti didesnes uz INBOX_MAX_FILE_BYTES (95 MB) - kitaip PHP
; nukirstu faila anksciau, nei ji paaiskina pats puslapis. Virsutini stoga vis
; tiek nustato Cloudflare (~100 MB uzklausos kunui).
upload_max_filesize = 100M
post_max_size = 112M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
