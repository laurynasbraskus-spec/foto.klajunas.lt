; Nariu ikelimas prima telefono originalus - numatytieji 2-8 MB per mazi.
; Failai keliami po viena, todel post_max_size uztenka vieno failo dydzio.
; Riba (160M) turi buti didesne uz INBOX_MAX_FILE_BYTES (150 MB) - kitaip
; PHP nukirstu faila anksciau, nei ji paaiskina pats puslapis.
upload_max_filesize = 160M
post_max_size = 176M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
